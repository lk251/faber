[project]
name = "faber"
version = "0.1.0"
description = "Verifier-first work market protocol primitives."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live-openai = ["openai>=2.45.0,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["faber"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
