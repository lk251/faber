<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Faber Proof trust boundary</title>
  <desc id="desc">Untrusted task, diff, and model planning flow into repository-approved bounded execution, then authoritative receipts produce a deterministic verdict.</desc>
  <rect width="1600" height="900" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1600" height="16" fill="#20242a"/>
  <text x="104" y="108" fill="#20242a" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700">Who plans, who executes, who decides?</text>
  <text x="104" y="158" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="28">Faber keeps model attention separate from verifier authority.</text>

  <rect x="104" y="232" width="410" height="474" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
  <rect x="596" y="232" width="410" height="474" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <rect x="1088" y="232" width="408" height="474" rx="6" fill="#edf9f1" stroke="#16803c" stroke-width="3"/>

  <text x="144" y="292" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">UNTRUSTED DATA</text>
  <text x="144" y="350" fill="#20242a" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Task + candidate diff</text>
  <text x="144" y="404" fill="#20242a" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">GPT-5.6 proof plan</text>
  <text x="144" y="468" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="24">Claims</text>
  <text x="144" y="506" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="24">Risk and severity</text>
  <text x="144" y="544" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="24">Approved template IDs</text>
  <text x="144" y="582" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="24">Bounded JSON parameters</text>
  <text x="144" y="646" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">NO COMMANDS. NO VERDICT.</text>

  <text x="636" y="292" fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">OWNER POLICY</text>
  <text x="636" y="350" fill="#20242a" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Faber validation</text>
  <text x="636" y="404" fill="#20242a" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Bounded executors</text>
  <text x="636" y="468" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="24">Closed parameter schemas</text>
  <text x="636" y="506" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="24">Pinned capabilities</text>
  <text x="636" y="544" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="24">Path and output limits</text>
  <text x="636" y="582" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="24">Exact context bindings</text>
  <text x="636" y="632" fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">ONLY APPROVED EVIDENCE</text>
  <text x="636" y="664" fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">RUNS</text>

  <text x="1128" y="292" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">AUTHORITATIVE RESULT</text>
  <text x="1128" y="350" fill="#20242a" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Runs + receipts</text>
  <text x="1128" y="404" fill="#20242a" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Deterministic policy</text>
  <text x="1128" y="468" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">PASS</text>
  <text x="1128" y="516" fill="#b42318" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">BLOCK</text>
  <text x="1128" y="564" fill="#7c3aed" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">HUMAN_REVIEW</text>
  <text x="1128" y="632" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">EVIDENCE, NOT PROSE,</text>
  <text x="1128" y="664" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">DECIDES</text>

  <path d="M 524 468 L 574 468" stroke="#4b5563" stroke-width="8" fill="none"/>
  <path d="M 574 468 L 554 452 M 574 468 L 554 484" stroke="#4b5563" stroke-width="8" fill="none"/>
  <path d="M 1016 468 L 1066 468" stroke="#4b5563" stroke-width="8" fill="none"/>
  <path d="M 1066 468 L 1046 452 M 1066 468 L 1046 484" stroke="#4b5563" stroke-width="8" fill="none"/>

  <rect x="104" y="768" width="1392" height="2" fill="#c9cfd8"/>
  <text x="104" y="824" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="24">Missing, stale, partial, contradictory, or unbound evidence cannot become PASS.</text>
</svg>
