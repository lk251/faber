<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Faber Proof bad and repaired patch comparison</title>
  <desc id="desc">Both patches pass ordinary tests. The bad patch is blocked by Faber Proof and the repaired patch passes.</desc>
  <rect width="1600" height="900" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1600" height="16" fill="#20242a"/>
  <text x="112" y="118" fill="#20242a" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700">Faber Proof</text>
  <text x="112" y="172" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="30">Codex can write the patch. Faber makes the patch prove itself.</text>

  <rect x="112" y="240" width="650" height="510" rx="6" fill="#ffffff" stroke="#c9cfd8" stroke-width="2"/>
  <rect x="838" y="240" width="650" height="510" rx="6" fill="#ffffff" stroke="#c9cfd8" stroke-width="2"/>

  <rect x="112" y="240" width="650" height="88" rx="6" fill="#fff1f1"/>
  <rect x="112" y="322" width="650" height="6" fill="#fff1f1"/>
  <rect x="838" y="240" width="650" height="88" rx="6" fill="#edf9f1"/>
  <rect x="838" y="322" width="650" height="6" fill="#edf9f1"/>

  <text x="160" y="298" fill="#8f1d1d" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">BAD PATCH</text>
  <text x="886" y="298" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">REPAIRED PATCH</text>

  <text x="160" y="403" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="26">Ordinary tests</text>
  <text x="690" y="403" text-anchor="end" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">PASS</text>
  <line x1="160" y1="438" x2="714" y2="438" stroke="#e1e5ea" stroke-width="2"/>

  <text x="160" y="507" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="26">Faber Proof</text>
  <text x="690" y="507" text-anchor="end" fill="#b42318" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">BLOCK</text>
  <line x1="160" y1="542" x2="714" y2="542" stroke="#e1e5ea" stroke-width="2"/>

  <text x="160" y="611" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="26">Failed claims</text>
  <text x="690" y="611" text-anchor="end" fill="#b42318" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">1</text>
  <text x="160" y="679" fill="#8f1d1d" font-family="Arial, Helvetica, sans-serif" font-size="24">Complete final report discarded</text>
  <text x="160" y="713" fill="#8f1d1d" font-family="Arial, Helvetica, sans-serif" font-size="24">at the exact turn boundary</text>

  <text x="886" y="403" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="26">Ordinary tests</text>
  <text x="1416" y="403" text-anchor="end" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">PASS</text>
  <line x1="886" y1="438" x2="1440" y2="438" stroke="#e1e5ea" stroke-width="2"/>

  <text x="886" y="507" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="26">Faber Proof</text>
  <text x="1416" y="507" text-anchor="end" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">PASS</text>
  <line x1="886" y1="542" x2="1440" y2="542" stroke="#e1e5ea" stroke-width="2"/>

  <text x="886" y="611" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="26">Required evidence</text>
  <text x="1416" y="611" text-anchor="end" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">3 / 3</text>
  <text x="886" y="679" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="24">Narrow evidence-driven repair</text>
  <text x="886" y="713" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="24">preserves the final report</text>

  <rect x="112" y="790" width="1376" height="2" fill="#c9cfd8"/>
  <text x="112" y="842" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="24">GPT-5.6 plans falsifiable obligations. Approved executable evidence decides.</text>
</svg>
